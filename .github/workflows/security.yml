# Lightweight security checks.
#
# Blocking: the secret scan, always — leaked credentials are an emergency
# regardless of context — and a CRITICAL advisory in the frontend's production
# dependencies on main (push + the weekly run). Everything else is advisory
# (step-level continue-on-error): a new upstream CVE must never block an
# unrelated PR, so on pull requests the audits only surface in the logs.
#
# push: two direct pushes to main (2026-09-09) were never scanned — nothing
# ran outside pull requests and the weekly schedule. On push, gitleaks scans
# the pushed commit range only; the scheduled run scans the full history.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC, runs against main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full commit history

      # Public repo: no GITLEAKS_LICENSE needed.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: npm audit (critical blocks on main)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Audits straight from package-lock.json — no install needed. Advisory
      # everywhere: continue-on-error keeps high-severity findings visible in
      # the logs without gating merges on upstream advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # The one audit that blocks, and only where it cannot hold an unrelated
      # PR hostage: main itself (push) and the weekly run. A critical advisory
      # in what ships to browsers turns the run red until it is patched.
      - name: Critical advisories block on main
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: npm audit --omit=dev --audit-level=critical

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # Export the locked runtime closure instead of `uv sync`-ing: installing
      # the real environment would drag in manimpango's pango/cairo build deps
      # for no benefit. The export carries hashes, which lets pip-audit run
      # with --disable-pip (audit the pinned set, install nothing).
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project -o requirements.txt

      - name: Audit locked dependencies
        run: pipx run pip-audit --disable-pip -r requirements.txt
        continue-on-error: true
