# Weekly LLM generation-quality evals — gates on regressions via
# backend/evals/check_regression.py (see backend/evals/README.md).
# Weekly, not nightly, since 2026-10-08: ~26 fewer runs a month saves ~CA$8/mo
# (5 papers x ~US$0.045 per paper at effort low) of Azure credits that have to
# last to 2028-07-29, and the regression gate only catches a collapse anyway.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AZURE_OPENAI_API_KEY      — Azure OpenAI key used by the agent pipeline
#   AZURE_OPENAI_ENDPOINT     — e.g. https://<resource>.openai.azure.com
#   AZURE_OPENAI_DEPLOYMENT   — deployment name (e.g. gpt-5-mini); a manual
#                               run can override it with the `deployment` input
# The run makes real, billable LLM calls (no rendering): ~US$0.045 per paper
# at effort low and ~$0.076 at medium, measured on gpt-5-mini 2026-09-07
# (c4799ae); paper count and per-paper viz cap keep cost bounded.
#
# A/B a model before pointing production at it (same day, same effort), e.g.:
#   gh workflow run evals.yml -f deployment=gpt-5-mini -f reasoning_effort=medium -f papers=5
#   gh workflow run evals.yml -f deployment=gpt-6-luna -f reasoning_effort=medium -f papers=5
# That is a smoke test (API errors, outright collapse), not a quality gate:
# RENDER_MODE=modal skips rendering and visual QA, and 5 papers x 2 viz cannot
# resolve a 10-point pass-rate drop. The production canary is the real gate.
name: Evals

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — evaluates 5 golden-set papers
  workflow_dispatch:
    inputs:
      papers:
        description: "Number of golden-set papers to evaluate"
        required: false
        default: "3"
      deployment:
        description: "Azure OpenAI deployment to evaluate (blank = the AZURE_OPENAI_DEPLOYMENT secret)"
        required: false
        default: ""
      # low/medium/high only: gpt-6-luna rejects `minimal` and gpt-5-mini
      # rejects `none`/`xhigh`, so anything else breaks one side of an A/B.
      reasoning_effort:
        description: "AZURE_OPENAI_REASONING_EFFORT for this run (production runs medium)"
        required: false
        type: choice
        options:
          - low
          - medium
          - high
        default: low

# Never overlap eval runs (they share the LLM quota); queue instead of cancel
# so a manual dispatch doesn't kill a scheduled run mid-flight.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    name: Golden-set generation evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: azure
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      # Scheduled runs have no inputs and fall back to the secret / low.
      AZURE_OPENAI_DEPLOYMENT: ${{ github.event.inputs.deployment || secrets.AZURE_OPENAI_DEPLOYMENT }}
      # Cost control: cheapest reasoning tier is plenty for the scheduled run.
      AZURE_OPENAI_REASONING_EFFORT: ${{ github.event.inputs.reasoning_effort || 'low' }}
      # Evals measure the LLM gates, not ffmpeg: disables local render testing.
      # run_evals.py also forces this before importing the pipeline.
      RENDER_MODE: modal
    steps:
      - uses: actions/checkout@v7

      # No rendering happens, but `uv sync` still builds manim's manimpango
      # from sdist on Linux (no manylinux wheels), which needs pango/cairo
      # headers. Same apt line as ci.yml.
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcairo2-dev libpango1.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run golden-set evals
        run: |
          uv run python evals/run_evals.py \
            --papers ${{ github.event.inputs.papers || '5' }} \
            --max-viz 2 \
            --output report.json

      - name: Check for regressions
        run: uv run python evals/check_regression.py report.json evals/baselines.json

      - name: Upload eval report
        if: always() # keep the report even when the regression gate fails
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: backend/report.json
          if-no-files-found: warn
